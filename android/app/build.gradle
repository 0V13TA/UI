plugins {
    id "com.android.application"
}

def appAssetsDir = providers.gradleProperty("uiAssetsDir")
    .orElse(rootProject.file("../../assets").absolutePath)
def appAssetDir = providers.gradleProperty("uiAssetDir").orElse("assets")

def syncProjectAssets = tasks.register("syncProjectAssets", Sync) {
    def sourceAssets = file(appAssetsDir.get())
    if (sourceAssets.exists()) {
        from(sourceAssets)
    }
    into(layout.buildDirectory.dir("generated/projectAssets/${appAssetDir.get()}"))
}

tasks.named("preBuild").configure {
    dependsOn(syncProjectAssets)
}

android {
    namespace "org.libsdl.app"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.odin.ui"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            manifest.srcFile "../../SDL/android-project/app/src/main/AndroidManifest.xml"
            java.srcDirs = ["../../SDL/android-project/app/src/main/java"]
            res.srcDirs = ["../../SDL/android-project/app/src/main/res"]
            assets.srcDirs = [layout.buildDirectory.dir("generated/projectAssets")]
            jniLibs.srcDirs = [rootProject.file("../build/android/jniLibs")]
        }
    }
}
